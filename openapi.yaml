{
  "openapi": "3.0.3",
  "info":
    {
      "title": "RoleFit Application Service",
      "version": "0.2.0",
      "description": "Internal application submission, review, and status notifications behind an authenticating gateway. Trusted identity headers are not public credentials. Submission forwards the bearer token to owning services.",
    },
  "servers":
    [
      {
        "url": "http://localhost:3004",
        "description": "Local internal testing only",
      },
      {
        "url": "http://localhost:8080",
        "description": "Gateway after owner integration",
      },
    ],
  "paths":
    {
      "/api/applications/mine":
        {
          "get":
            {
              "operationId": "listMyApplications",
              "description": "Seekers only; reads applications owned by X-User-Id.",
              "parameters":
                [
                  {
                    "name": "X-User-Id",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string" },
                    "description": "Verified JWT subject, injected by the gateway",
                  },
                  {
                    "name": "X-User-Role",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string" },
                    "description": "Verified app_metadata.role: seeker or recruiter",
                  },
                  {
                    "name": "X-Company-Id",
                    "in": "header",
                    "required": false,
                    "schema": { "type": "string" },
                    "description": "Required for every recruiter request; trusted company identity, never client input",
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/ApplicationList",
                                },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid request",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "401":
                    {
                      "description": "Missing verified identity",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "403":
                    {
                      "description": "Forbidden",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "404":
                    {
                      "description": "Application or route not found",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "409":
                    {
                      "description": "Stored notification data is invalid",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "503":
                    {
                      "description": "Storage unavailable",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/applications":
        {
          "get":
            {
              "operationId": "listApplicantsForJob",
              "description": "Recruiters only; filters by jobId and verified company. Empty list for unknown/unowned jobs; no cross-service job lookup.",
              "parameters":
                [
                  {
                    "name": "X-User-Id",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string" },
                    "description": "Verified JWT subject, injected by the gateway",
                  },
                  {
                    "name": "X-User-Role",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string" },
                    "description": "Verified app_metadata.role: seeker or recruiter",
                  },
                  {
                    "name": "X-Company-Id",
                    "in": "header",
                    "required": false,
                    "schema": { "type": "string" },
                    "description": "Required for every recruiter request; trusted company identity, never client input",
                  },
                  {
                    "name": "jobId",
                    "in": "query",
                    "required": true,
                    "schema":
                      { "type": "string", "minLength": 1, "maxLength": 200 },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/ApplicationList",
                                },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid request",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "401":
                    {
                      "description": "Missing verified identity",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "403":
                    {
                      "description": "Forbidden",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "404":
                    {
                      "description": "Application or route not found",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "409":
                    {
                      "description": "Stored notification data is invalid",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "503":
                    {
                      "description": "Storage unavailable",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
          "post":
            {
              "operationId": "submitApplication",
              "description": "Seekers only. Checks job openness/deadline and cover letter, obtains approved resume and match, reads own profile contact fields, then atomically inserts application and initial history. Duplicate candidate/job returns 409. Auth remains in gateway.",
              "parameters":
                [
                  {
                    "name": "X-User-Id",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "format": "uuid" },
                    "description": "Gateway-verified seeker UUID; request cannot choose another candidate",
                  },
                  {
                    "name": "X-User-Role",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string", "enum": ["seeker"] },
                  },
                  {
                    "name": "Authorization",
                    "in": "header",
                    "required": true,
                    "schema":
                      {
                        "type": "string",
                        "pattern": "^[Bb][Ee][Aa][Rr][Ee][Rr]\\s+\\S+$",
                      },
                    "description": "Gateway preserves the verified token for upstream calls; Application does not reverify JWT",
                  },
                ],
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/Submission" },
                          "example": { "jobId": "job_seed_frontend" },
                        },
                    },
                },
              "responses":
                {
                  "201":
                    {
                      "description": "Application and initial Submitted history committed; no submission email/event",
                      "headers":
                        {
                          "Location":
                            {
                              "schema": { "type": "string" },
                              "description": "Internal application read path",
                            },
                        },
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/ApplicationResponse",
                                },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid jobId, coverLetter, JSON or extra body fields",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "401":
                    {
                      "description": "Missing verified seeker identity or forwarded bearer token, or upstream rejected identity",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "403":
                    {
                      "description": "Only seekers may submit, or upstream denied access",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "404":
                    {
                      "description": "Job not found",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "409":
                    {
                      "description": "ALREADY_APPLIED, JOB_NOT_OPEN, APPLICATION_DEADLINE_PASSED, COVER_LETTER_REQUIRED, RESUME_DRAFT_NOT_FOUND, RESUME_NOT_APPROVED, PROFILE_REQUIRED or PROFILE_INCOMPLETE",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "502":
                    {
                      "description": "UPSTREAM_ERROR or UPSTREAM_RESPONSE_INVALID; no application saved",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "503":
                    {
                      "description": "Database or required upstream unavailable/timed out; no application saved",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/applications/{applicationId}":
        {
          "get":
            {
              "operationId": "getApplication",
              "description": "Owning seeker or recruiter from owning company. Returns stored candidate, job, approved resume, match and status history without live upstream calls.",
              "parameters":
                [
                  {
                    "name": "X-User-Id",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string" },
                    "description": "Verified JWT subject, injected by the gateway",
                  },
                  {
                    "name": "X-User-Role",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string" },
                    "description": "Verified app_metadata.role: seeker or recruiter",
                  },
                  {
                    "name": "X-Company-Id",
                    "in": "header",
                    "required": false,
                    "schema": { "type": "string" },
                    "description": "Required for every recruiter request; trusted company identity, never client input",
                  },
                  {
                    "name": "applicationId",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/ApplicationResponse",
                                },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid request",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "401":
                    {
                      "description": "Missing verified identity",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "403":
                    {
                      "description": "Forbidden",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "404":
                    {
                      "description": "Application or route not found",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "409":
                    {
                      "description": "Stored notification data is invalid",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "503":
                    {
                      "description": "Storage unavailable",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
            },
        },
      "/api/applications/{applicationId}/status":
        {
          "patch":
            {
              "operationId": "updateApplicationStatus",
              "description": "Recruiters from the owning company only. Same status is a no-op; all five defined statuses are allowed. Queued means persisted in the outbox, not SMTP delivered.",
              "parameters":
                [
                  {
                    "name": "X-User-Id",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string" },
                    "description": "Verified JWT subject, injected by the gateway",
                  },
                  {
                    "name": "X-User-Role",
                    "in": "header",
                    "required": true,
                    "schema": { "type": "string" },
                    "description": "Verified app_metadata.role: seeker or recruiter",
                  },
                  {
                    "name": "X-Company-Id",
                    "in": "header",
                    "required": false,
                    "schema": { "type": "string" },
                    "description": "Required for every recruiter request; trusted company identity, never client input",
                  },
                  {
                    "name": "applicationId",
                    "in": "path",
                    "required": true,
                    "schema": { "type": "string" },
                  },
                ],
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/StatusResponse",
                                },
                            },
                        },
                    },
                  "400":
                    {
                      "description": "Invalid request",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "401":
                    {
                      "description": "Missing verified identity",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "403":
                    {
                      "description": "Forbidden",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "404":
                    {
                      "description": "Application or route not found",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "409":
                    {
                      "description": "Stored notification data is invalid",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                  "503":
                    {
                      "description": "Storage unavailable",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Error" },
                            },
                        },
                    },
                },
              "requestBody":
                {
                  "required": true,
                  "content":
                    {
                      "application/json":
                        {
                          "schema":
                            { "$ref": "#/components/schemas/StatusUpdate" },
                        },
                    },
                },
            },
        },
      "/health":
        {
          "get":
            {
              "description": "Liveness",
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Health" },
                            },
                        },
                    },
                },
            },
        },
      "/ready":
        {
          "get":
            {
              "description": "Database readiness; RabbitMQ outage reports degraded with HTTP 200.",
              "responses":
                {
                  "200":
                    {
                      "description": "Success",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Health" },
                            },
                        },
                    },
                  "503":
                    {
                      "description": "Database unavailable",
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                { "$ref": "#/components/schemas/Health" },
                            },
                        },
                    },
                },
            },
        },
    },
  "components":
    {
      "schemas":
        {
          "Error":
            {
              "type": "object",
              "required": ["error"],
              "properties":
                {
                  "error":
                    {
                      "type": "object",
                      "required": ["code", "message"],
                      "properties":
                        {
                          "code": { "type": "string" },
                          "message": { "type": "string" },
                        },
                    },
                },
            },
          "Health":
            {
              "type": "object",
              "required": ["status"],
              "properties":
                {
                  "status": { "type": "string" },
                  "database": { "type": "boolean" },
                  "broker": { "type": "boolean" },
                  "service": { "type": "string" },
                },
            },
          "StatusUpdate":
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["status"],
              "properties":
                {
                  "status":
                    {
                      "type": "string",
                      "enum":
                        [
                          "Submitted",
                          "Under review",
                          "Interview",
                          "Offer",
                          "Rejected",
                        ],
                    },
                  "note": { "type": "string", "maxLength": 2000 },
                },
            },
          "Candidate":
            {
              "type": "object",
              "required": ["id", "name", "email"],
              "properties":
                {
                  "id": { "type": "string" },
                  "name": { "type": "string" },
                  "email": { "type": "string", "format": "email" },
                },
            },
          "JobSnapshot":
            {
              "type": "object",
              "required": ["id", "title", "companyId"],
              "properties":
                {
                  "id": { "type": "string" },
                  "title": { "type": "string" },
                  "companyId": { "type": "string" },
                },
            },
          "HistoryEntry":
            {
              "type": "object",
              "required": ["status", "at", "changedBy", "note"],
              "properties":
                {
                  "status":
                    {
                      "type": "string",
                      "enum":
                        [
                          "Submitted",
                          "Under review",
                          "Interview",
                          "Offer",
                          "Rejected",
                        ],
                    },
                  "at": { "type": "string", "format": "date-time" },
                  "changedBy": { "type": "string" },
                  "note": { "type": "string", "nullable": true },
                },
            },
          "Application":
            {
              "type": "object",
              "required":
                [
                  "id",
                  "jobId",
                  "companyId",
                  "candidateId",
                  "candidate",
                  "jobSnapshot",
                  "resumeReference",
                  "matchSnapshot",
                  "status",
                  "submittedAt",
                  "updatedAt",
                  "history",
                  "resumeSnapshot",
                  "coverLetter",
                ],
              "properties":
                {
                  "id": { "type": "string" },
                  "jobId": { "type": "string" },
                  "companyId": { "type": "string" },
                  "candidateId": { "type": "string" },
                  "candidate": { "$ref": "#/components/schemas/Candidate" },
                  "jobSnapshot": { "$ref": "#/components/schemas/JobSnapshot" },
                  "resumeReference":
                    {
                      "type": "object",
                      "nullable": true,
                      "additionalProperties": true,
                      "description": "Submission stores draftId, format (company/personal), approvedAt and updatedAt; legacy references are retained.",
                    },
                  "matchSnapshot":
                    {
                      "type": "object",
                      "nullable": true,
                      "additionalProperties": true,
                      "description": "Full MatchResult plus summary (explanation) and capturedAt; legacy snapshots retained. Reads never call Job Discovery.",
                    },
                  "status":
                    {
                      "type": "string",
                      "enum":
                        [
                          "Submitted",
                          "Under review",
                          "Interview",
                          "Offer",
                          "Rejected",
                        ],
                    },
                  "submittedAt": { "type": "string", "format": "date-time" },
                  "updatedAt": { "type": "string", "format": "date-time" },
                  "history":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/HistoryEntry" },
                    },
                  "resumeSnapshot":
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "required":
                        [
                          "draftId",
                          "candidateId",
                          "jobId",
                          "format",
                          "sections",
                          "approvedAt",
                          "updatedAt",
                        ],
                      "properties":
                        {
                          "draftId":
                            {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 100,
                            },
                          "candidateId": { "type": "string", "format": "uuid" },
                          "jobId":
                            {
                              "type": "string",
                              "minLength": 1,
                              "maxLength": 100,
                            },
                          "format": { "enum": ["company", "personal"] },
                          "sections":
                            {
                              "type": "array",
                              "minItems": 1,
                              "maxItems": 100,
                              "items":
                                {
                                  "type": "object",
                                  "additionalProperties": false,
                                  "required":
                                    [
                                      "id",
                                      "kind",
                                      "title",
                                      "meta",
                                      "bullets",
                                      "emphasized",
                                    ],
                                  "properties":
                                    {
                                      "id":
                                        {
                                          "type": "string",
                                          "minLength": 1,
                                          "maxLength": 100,
                                        },
                                      "kind":
                                        {
                                          "enum":
                                            [
                                              "summary",
                                              "skills",
                                              "education",
                                              "experience",
                                              "project",
                                            ],
                                        },
                                      "title":
                                        {
                                          "type": "string",
                                          "minLength": 1,
                                          "maxLength": 2000,
                                        },
                                      "meta":
                                        { "type": "string", "maxLength": 2000 },
                                      "bullets":
                                        {
                                          "type": "array",
                                          "maxItems": 50,
                                          "items":
                                            {
                                              "type": "object",
                                              "additionalProperties": false,
                                              "required":
                                                ["id", "text", "tailored"],
                                              "properties":
                                                {
                                                  "id":
                                                    {
                                                      "type": "string",
                                                      "minLength": 1,
                                                      "maxLength": 100,
                                                    },
                                                  "text":
                                                    {
                                                      "type": "string",
                                                      "minLength": 1,
                                                      "maxLength": 2000,
                                                    },
                                                  "tailored":
                                                    { "type": "boolean" },
                                                },
                                            },
                                        },
                                      "emphasized": { "type": "boolean" },
                                    },
                                },
                            },
                          "approvedAt":
                            { "type": "string", "format": "date-time" },
                          "updatedAt":
                            { "type": "string", "format": "date-time" },
                        },
                      "nullable": true,
                      "description": "Immutable approved-resume content copied at submission; null for legacy seeded records.",
                    },
                  "coverLetter":
                    { "type": "string", "nullable": true, "maxLength": 10000 },
                },
            },
          "ApplicationList":
            {
              "type": "object",
              "required": ["applications"],
              "properties":
                {
                  "applications":
                    {
                      "type": "array",
                      "items": { "$ref": "#/components/schemas/Application" },
                    },
                },
            },
          "ApplicationResponse":
            {
              "type": "object",
              "required": ["application"],
              "properties":
                {
                  "application": { "$ref": "#/components/schemas/Application" },
                },
            },
          "StatusResponse":
            {
              "type": "object",
              "required": ["application", "notificationQueued"],
              "properties":
                {
                  "application": { "$ref": "#/components/schemas/Application" },
                  "notificationQueued": { "type": "boolean" },
                },
            },
          "ApprovedResume":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "draftId",
                  "candidateId",
                  "jobId",
                  "format",
                  "sections",
                  "approvedAt",
                  "updatedAt",
                ],
              "properties":
                {
                  "draftId":
                    { "type": "string", "minLength": 1, "maxLength": 100 },
                  "candidateId": { "type": "string", "format": "uuid" },
                  "jobId":
                    { "type": "string", "minLength": 1, "maxLength": 100 },
                  "format": { "enum": ["company", "personal"] },
                  "sections":
                    {
                      "type": "array",
                      "minItems": 1,
                      "maxItems": 100,
                      "items":
                        {
                          "type": "object",
                          "additionalProperties": false,
                          "required":
                            [
                              "id",
                              "kind",
                              "title",
                              "meta",
                              "bullets",
                              "emphasized",
                            ],
                          "properties":
                            {
                              "id":
                                {
                                  "type": "string",
                                  "minLength": 1,
                                  "maxLength": 100,
                                },
                              "kind":
                                {
                                  "enum":
                                    [
                                      "summary",
                                      "skills",
                                      "education",
                                      "experience",
                                      "project",
                                    ],
                                },
                              "title":
                                {
                                  "type": "string",
                                  "minLength": 1,
                                  "maxLength": 2000,
                                },
                              "meta": { "type": "string", "maxLength": 2000 },
                              "bullets":
                                {
                                  "type": "array",
                                  "maxItems": 50,
                                  "items":
                                    {
                                      "type": "object",
                                      "additionalProperties": false,
                                      "required": ["id", "text", "tailored"],
                                      "properties":
                                        {
                                          "id":
                                            {
                                              "type": "string",
                                              "minLength": 1,
                                              "maxLength": 100,
                                            },
                                          "text":
                                            {
                                              "type": "string",
                                              "minLength": 1,
                                              "maxLength": 2000,
                                            },
                                          "tailored": { "type": "boolean" },
                                        },
                                    },
                                },
                              "emphasized": { "type": "boolean" },
                            },
                        },
                    },
                  "approvedAt": { "type": "string", "format": "date-time" },
                  "updatedAt": { "type": "string", "format": "date-time" },
                },
            },
          "MatchResult":
            {
              "type": "object",
              "additionalProperties": false,
              "required":
                [
                  "jobId",
                  "candidateId",
                  "score",
                  "breakdown",
                  "matchedSkills",
                  "missingSkills",
                  "strengths",
                  "gaps",
                  "explanation",
                  "computedAt",
                ],
              "properties":
                {
                  "jobId":
                    { "type": "string", "minLength": 1, "maxLength": 100 },
                  "candidateId": { "type": "string", "format": "uuid" },
                  "score": { "type": "number", "minimum": 0, "maximum": 100 },
                  "breakdown":
                    {
                      "type": "object",
                      "additionalProperties": false,
                      "required":
                        ["skills", "experience", "education", "preferences"],
                      "properties":
                        {
                          "skills":
                            { "type": "number", "minimum": 0, "maximum": 100 },
                          "experience":
                            { "type": "number", "minimum": 0, "maximum": 100 },
                          "education":
                            { "type": "number", "minimum": 0, "maximum": 100 },
                          "preferences":
                            { "type": "number", "minimum": 0, "maximum": 100 },
                        },
                    },
                  "matchedSkills":
                    {
                      "type": "array",
                      "maxItems": 100,
                      "items":
                        { "type": "string", "minLength": 1, "maxLength": 4000 },
                    },
                  "missingSkills":
                    {
                      "type": "array",
                      "maxItems": 100,
                      "items":
                        { "type": "string", "minLength": 1, "maxLength": 4000 },
                    },
                  "strengths":
                    {
                      "type": "array",
                      "maxItems": 100,
                      "items":
                        { "type": "string", "minLength": 1, "maxLength": 4000 },
                    },
                  "gaps":
                    {
                      "type": "array",
                      "maxItems": 100,
                      "items":
                        { "type": "string", "minLength": 1, "maxLength": 4000 },
                    },
                  "explanation":
                    { "type": "string", "minLength": 1, "maxLength": 20000 },
                  "computedAt": { "type": "string", "format": "date-time" },
                },
            },
          "Submission":
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["jobId"],
              "properties":
                {
                  "jobId":
                    {
                      "type": "string",
                      "pattern": "^[A-Za-z0-9_-]{1,100}$",
                      "maxLength": 100,
                    },
                  "coverLetter":
                    {
                      "type": "string",
                      "maxLength": 10000,
                      "description": "Required if Job Posting requires a cover letter. Trimmed; empty becomes null.",
                    },
                },
            },
        },
    },
}
